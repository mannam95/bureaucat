# Automated release: build the image, push it to Docker Hub, tag the commit and
# cut a GitHub Release - all driven by the version number computed from git tags
# and the commit messages. No manual version bump, no local docker build.
#
# ── One-time setup (done on the host, not by CI) ──────────────────────────────
#   1. Secrets  (Settings -> Secrets and variables -> Actions):
#        DOCKERHUB_USERNAME  = mvsrinath
#        DOCKERHUB_TOKEN     = a Docker Hub access token (Account Settings ->
#                              Security -> New Access Token, Read & Write).
#                              Use a token, never your password.
#   2. Seed tag  (so CI has a version to count from):
#        git tag -a v1.2.2 -m "Release 1.2.2" b9d18fb
#        git push origin v1.2.2
#   3. Settings -> Actions -> General -> Workflow permissions:
#        "Read and write permissions" (lets CI push the tag and the Release).
#
# ── How the version is chosen ─────────────────────────────────────────────────
#   auto (default, and what a push to main uses): read the commits since the
#   last tag and bump per Conventional Commits -
#        feat!: / fix!: / "BREAKING CHANGE"  -> major   (1.2.3 -> 2.0.0)
#        feat:                                -> minor   (1.2.3 -> 1.3.0)
#        fix: / perf:                         -> patch   (1.2.3 -> 1.2.4)
#        anything else (chore/docs/...)       -> no release
#   Numbers are never capped at 9: ten fixes in a row gives 1.2.13, not 1.3.0.
#   A minor only happens when a feature lands; a major only when you mark a
#   commit breaking - so the version always tells the truth about compatibility.
#
#   Need to force it? Run this workflow manually (Actions -> release -> Run
#   workflow) and pick patch / minor / major from the dropdown.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = infer from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Serialize releases; never cancel one partway through a push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub Release

env:
  IMAGE: docker.io/mvsrinath/sprintboard

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next version

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Highest existing release tag. CI cannot invent the first one.
          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z tag found. Seed one first, e.g. 'git tag -a v1.2.2 -m \"Release 1.2.2\" <commit> && git push origin v1.2.2'."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"

          bump="${{ github.event.inputs.bump || 'auto' }}"
          if [ "$bump" = "auto" ]; then
            # Subjects + bodies of every commit added since the last release.
            msgs="$(git log --format='%s%n%b' "${latest}..HEAD")"
            if   grep -qE '^(feat|fix|refactor|perf)(\([^)]+\))?!:|BREAKING CHANGE' <<< "$msgs"; then bump=major
            elif grep -qE '^feat(\([^)]+\))?:'                                      <<< "$msgs"; then bump=minor
            elif grep -qE '^(fix|perf)(\([^)]+\))?:'                                <<< "$msgs"; then bump=patch
            else bump=none
            fi
          fi

          if [ "$bump" = "none" ]; then
            echo "No releasable commits since ${latest}; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"

          echo "release=true"               >> "$GITHUB_OUTPUT"
          echo "version=${version}"         >> "$GITHUB_OUTPUT"
          echo "tag=v${version}"            >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (${bump} bump from ${latest})"

      - name: Set up Docker Buildx
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag commit and create GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
