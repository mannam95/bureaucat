      first_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      last_name:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  handlers.WorkspaceResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      workspace_key:
        type: string
    type: object
  handlers.WorkspaceStat:
    properties:
      name:
        type: string
      project_count:
        type: integer
      workspace_key:
        type: string
    type: object
  insights.AgingRow:
    properties:
      assignee:
        $ref: '#/definitions/insights.UserRef'
      days:
        type: integer
      key:
        type: string
      state:
        $ref: '#/definitions/insights.StateRef'
      title:
        type: string
    type: object
  insights.BandCount:
    properties:
      band:
        description: '"1-4", "5-9", "10-16", "17+", "not_assessed"'
        type: string
      count:
        type: integer
    type: object
  insights.ComplexitySum:
    properties:
      assessed:
        type: integer
      not_assessed:
        type: integer
      of:
        type: integer
      sum:
        type: integer
    type: object
  insights.CycleCount:
    properties:
      count:
        type: integer
      cycle:
        $ref: '#/definitions/insights.CycleRef'
    type: object
  insights.CycleRef:
    properties:
      end_date:
        type: string
      id:
        type: string
      start_date:
        type: string
      status:
        description: upcoming | active | completed
        type: string
      title:
        type: string
    type: object
  insights.CycleSection:
    properties:
      added:
        $ref: '#/definitions/insights.Tile'
      archived:
        $ref: '#/definitions/insights.Tile'
      at_close:
        type: integer
      bands:
        items:
          $ref: '#/definitions/insights.BandCount'
        type: array
      cancelled:
        $ref: '#/definitions/insights.Tile'
      carried_over:
        $ref: '#/definitions/insights.Tile'
      days:
        items:
          $ref: '#/definitions/insights.DayPoint'
        type: array
      delivered:
        $ref: '#/definitions/insights.Tile'
      handed_off:
        allOf:
        - $ref: '#/definitions/insights.Tile'
        description: |-
          HandedOff is nil when the project defines no verification states: the
          developer finish line coincides with delivery, so the tile would repeat
          the Delivered number.
      identity:
        description: |-
          Identity is the reconciliation line: planned + added - removed = at
          close = completed + in verification + open + cancelled + archived.
        type: string
      in_verification:
        allOf:
        - $ref: '#/definitions/insights.Tile'
        description: |-
          InVerification/Cancelled/Archived are nil when the project defines no
          state of that type — the tile is absent, not zero.
      original_plan_delivered:
        allOf:
        - $ref: '#/definitions/insights.Tile'
        description: delivered items that were planned at start
      planned_at_start:
        $ref: '#/definitions/insights.Tile'
      removed:
        $ref: '#/definitions/insights.Tile'
    type: object
  insights.DayPoint:
    properties:
      added:
        type: integer
      cancelled:
        type: integer
      completed:
        type: integer
      completed_cum:
        type: integer
      date:
        description: YYYY-MM-DD in the reporting timezone
        type: string
      removed:
        type: integer
      scope:
        type: integer
      weekend:
        type: boolean
    type: object
  insights.DueRow:
    properties:
      assignee:
        $ref: '#/definitions/insights.UserRef'
      due:
        type: string
      key:
        type: string
      late_days:
        description: negative = due in N days
        type: integer
      title:
        type: string
    type: object
  insights.Evidence:
    properties:
      chips:
        items:
          type: string
        type: array
      count:
        type: integer
      cx:
        $ref: '#/definitions/insights.ComplexitySum'
      how_computed:
        type: string
      metric:
        type: string
      rows:
        items:
          $ref: '#/definitions/insights.EvidenceRow'
        type: array
      scope:
        $ref: '#/definitions/insights.Scope'
      source_events:
        type: string
      task_list_query:
        description: |-
          TaskListQuery is set only when the population is expressible as task
          list filters; empty means link/CSV only. No fake equivalence.
        type: string
      title:
        type: string
    type: object
  insights.EvidenceRow:
    properties:
      age_days:
        type: integer
      assessed:
        type: boolean
      assignees:
        items:
          $ref: '#/definitions/insights.UserRef'
        type: array
      completed_at:
        type: string
      complexity:
        type: integer
      credits:
        items:
          $ref: '#/definitions/insights.UserRef'
        type: array
      due:
        type: string
      entered_cycle:
        description: '"planned" or "added YYYY-MM-DD"'
        type: string
      key:
        type: string
      marked_complete_by:
        $ref: '#/definitions/insights.UserRef'
      parent_key:
        type: string
      parent_title:
        type: string
      priority:
        $ref: '#/definitions/insights.PriorityRef'
      state:
        $ref: '#/definitions/insights.StateRef'
      title:
        type: string
    type: object
  insights.Health:
    properties:
      aging:
        items:
          $ref: '#/definitions/insights.AgingRow'
        type: array
      blocked:
        type: integer
      due:
        items:
          $ref: '#/definitions/insights.DueRow'
        type: array
      in_started:
        type: integer
      in_verification:
        type: integer
      intake:
        type: integer
      intake_by_state:
        items:
          $ref: '#/definitions/insights.StateCount'
        type: array
      open:
        type: integer
      open_by_state:
        items:
          $ref: '#/definitions/insights.StateCount'
        type: array
      overdue:
        type: integer
      priority_mix:
        items:
          $ref: '#/definitions/insights.RankCount'
        type: array
      weekly:
        items:
          $ref: '#/definitions/insights.WeekPoint'
        type: array
    type: object
  insights.PersonProjectRow:
    properties:
      comments:
        type: integer
      created:
        type: integer
      cx:
        $ref: '#/definitions/insights.ComplexitySum'
      delivered:
        type: integer
      handed_off:
        type: integer
      open_now:
        type: integer
      project_key:
        type: string
      project_name:
        type: string
      top_rank_handled:
        type: integer
    type: object
  insights.PersonReport:
    properties:
      bands:
        items:
          $ref: '#/definitions/insights.BandCount'
        type: array
      by_cycle:
        items:
          $ref: '#/definitions/insights.CycleCount'
        type: array
      comments:
        type: integer
      created:
        type: integer
      credit_rule:
        type: string
      delivered:
        $ref: '#/definitions/insights.Tile'
      handed_off:
        allOf:
        - $ref: '#/definitions/insights.Tile'
        description: |-
          HandedOff is absent when the project has no verification states;
          HandoffRule is its tooltip, as on the project report.
      handoff_rule:
        type: string
      open_now:
        type: integer
      scope:
        $ref: '#/definitions/insights.Scope'
      top_rank_handled:
        type: integer
      user:
        $ref: '#/definitions/insights.UserRef'
      weekly:
        items:
          $ref: '#/definitions/insights.WeekPoint'
        type: array
      worked_with:
        description: |-
          WorkedWith lists the people who shared credit on this person's delivered
          items over the window.
        items:
          $ref: '#/definitions/insights.UserCount'
        type: array
    type: object
  insights.PersonRow:
    properties:
      comments:
        type: integer
      created:
        type: integer
      cx:
        $ref: '#/definitions/insights.ComplexitySum'
      delivered:
        type: integer
      handed_off:
        description: |-
          HandedOff counts items this person pushed past the developer finish line
          (into a verification- or completed-type state) during the window. In a
          project without verification states the column is hidden and the number
          effectively tracks Delivered (a completed-to-completed move can nudge
          them apart, which is why the hidden number never drives the sort there).
        type: integer
      has_activity:
        type: boolean
      open_at_end:
        type: integer
      shared:
        description: of Delivered, items credited to >1 person
        type: integer
      top_rank_handled:
        description: delivered at the project's top two ranks
        type: integer
      user:
        $ref: '#/definitions/insights.UserRef'
    type: object
  insights.PersonTable:
    properties:
      credit_rule:
        type: string
      rows:
        items:
          $ref: '#/definitions/insights.PersonRow'
        type: array
      total_cx:
        $ref: '#/definitions/insights.ComplexitySum'
      total_delivered:
        description: distinct items
        type: integer
      total_handed_off:
        description: distinct items
        type: integer
    type: object
  insights.Portfolio:
    properties:
      delivered:
        $ref: '#/definitions/insights.PortfolioDelivered'
      rows:
        items:
          $ref: '#/definitions/insights.PortfolioRow'
        type: array
      rule:
        description: the attention rule, shown, not hidden
        type: string
      scope:
        $ref: '#/definitions/insights.Scope'
    type: object
  insights.PortfolioDelivered:
    properties:
      by_project:
        items:
          $ref: '#/definitions/insights.ProjectCount'
        type: array
      cancelled:
        type: integer
      cx:
        $ref: '#/definitions/insights.ComplexitySum'
      total:
        type: integer
    type: object
  insights.PortfolioRow:
    properties:
      active_cycle:
        $ref: '#/definitions/insights.CycleRef'
      active_people:
        type: integer
      archived:
        type: integer
      attention:
        type: boolean
      attention_why:
        type: string
      blocked:
        type: integer
      cancelled:
        type: integer
      completed:
        type: integer
      created:
        type: integer
      has_cycles:
        type: boolean
      history_days:
        type: integer
      icon_url:
        type: string
      intake:
        type: integer
      low_history:
        type: boolean
      members:
        type: integer
      oldest:
        $ref: '#/definitions/insights.AgingRow'
      open:
        type: integer
      overdue:
        type: integer
      project_key:
        type: string
      project_name:
        type: string
      top_rank_name:
        type: string
      top_rank_open:
        type: integer
      trend:
        description: filling | draining | steady | no_history
        type: string
      weekly:
        items:
          $ref: '#/definitions/insights.WeekPoint'
        type: array
    type: object
  insights.PriorityRef:
    properties:
      active:
        type: boolean
      color:
        type: string
      id:
        type: string
      name:
        type: string
      rank:
        type: integer
    type: object
  insights.ProjectCount:
    properties:
      count:
        type: integer
      project_key:
        type: string
    type: object
  insights.ProjectReport:
    properties:
      cycle:
        $ref: '#/definitions/insights.CycleSection'
      cycles:
        items:
          $ref: '#/definitions/insights.CycleRef'
        type: array
      handoff_rule:
        type: string
      has_areas:
        description: |-
          Vocabularies the frontend needs for panels that are conditional on their
          existence.
        type: boolean
      has_labels:
        type: boolean
      has_verification:
        description: |-
          HasVerification gates the Handed off tile and person column; HandoffRule
          is its tooltip, spelled in the project's own state names.
        type: boolean
      health:
        $ref: '#/definitions/insights.Health'
      people:
        $ref: '#/definitions/insights.PersonTable'
      range:
        $ref: '#/definitions/insights.RangeSection'
      scope:
        $ref: '#/definitions/insights.Scope'
    type: object
  insights.RangeSection:
    properties:
      bands:
        items:
          $ref: '#/definitions/insights.BandCount'
        type: array
      cancelled:
        $ref: '#/definitions/insights.Tile'
      completed:
        $ref: '#/definitions/insights.Tile'
      created:
        $ref: '#/definitions/insights.Tile'
      days:
        items:
          $ref: '#/definitions/insights.DayPoint'
        type: array
      handed_off:
        allOf:
        - $ref: '#/definitions/insights.Tile'
        description: 'HandedOff mirrors CycleSection: absent without verification
          states.'
      has_cycles:
        description: |-
          HasCycles says whether the project could run cycle reports at all; false
          renders the quiet "create a cycle" hint.
        type: boolean
    type: object
  insights.RankCount:
    properties:
      count:
        type: integer
      priority:
        $ref: '#/definitions/insights.PriorityRef'
    type: object
  insights.Scope:
    properties:
      counting_rule:
        description: CountingRule is the plain-language line shown under the scope.
        type: string
      cutoff:
        type: string
      cycle_id:
        type: string
      cycle_title:
        type: string
      from:
        type: string
      generated_at:
        type: string
      project_key:
        type: string
      project_name:
        type: string
      timezone:
        type: string
      to:
        description: inclusive end of the window's last day
        type: string
    type: object
  insights.StateCount:
    properties:
      count:
        type: integer
      state:
        $ref: '#/definitions/insights.StateRef'
    type: object
  insights.StateRef:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  insights.Tile:
    properties:
      count:
        type: integer
      cx:
        $ref: '#/definitions/insights.ComplexitySum'
      metric:
        type: string
      subtasks:
        description: |-
          Subtasks says how many of Count are subtasks, so a delivery number is
          honest about its units ("17 delivered · 9 subtasks"). Only the delivery
          tiles fill it.
        type: integer
    type: object
  insights.UserCount:
    properties:
      count:
        type: integer
      user:
        $ref: '#/definitions/insights.UserRef'
    type: object
  insights.UserRef:
    properties:
      avatar_url:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      username:
        type: string
    type: object
  insights.WeekPoint:
    properties:
      completed:
        type: integer
      created:
        type: integer
      week_start:
        description: YYYY-MM-DD (Monday, reporting timezone)
        type: string
    type: object
  insights.WorkspacePersonReport:
    properties:
      comments:
        type: integer
      created:
        type: integer
      credit_rule:
        type: string
      delivered:
        $ref: '#/definitions/insights.Tile'
      handed_off:
        type: integer
      has_verification:
        description: |-
          HasVerification is true when any contributing project defines
          verification states — the gate for showing the Handed off tile.
        type: boolean
      open_now:
        type: integer
      projects:
        description: |-
          Projects holds one row per project that contributed anything (membership
          or windowed activity), most delivered first.
        items:
          $ref: '#/definitions/insights.PersonProjectRow'
        type: array
      projects_considered:
        description: |-
          ProjectsConsidered counts the viewer's projects the sums ran over, so the
          scope line can be honest about coverage.
        type: integer
      scope:
        $ref: '#/definitions/insights.Scope'
      top_rank_handled:
        type: integer
      user:
        $ref: '#/definitions/insights.UserRef'
      weekly:
        items:
          $ref: '#/definitions/insights.WeekPoint'
        type: array
      worked_with:
        items:
          $ref: '#/definitions/insights.UserCount'
        type: array
    type: object
host: localhost:1341
info:
  contact: {}
  description: Bureaucat - Approval workflow application API
  title: Bureaucat API
  version: "1.0"
paths:
  /admin/email:
    get:
      description: Whether env-configured SMTP is usable, and the From address. Super
        admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.EmailStatusResponse'
      security:
      - BearerAuth: []
      summary: Email status
      tags:
      - Admin - Email
  /admin/email/test:
    post:
      consumes:
      - application/json
      description: Send a notification template with sample data to a chosen user.
        Super admin only.
      parameters:
      - description: Recipient and template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SendTestEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send test email
      tags:
      - Admin - Email
  /admin/features:
    get:
      description: Every registered gated feature with its mode and specific-user
        grants. Super admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.FeatureGateResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List feature gates
      tags:
      - Admin - Features
  /admin/features/{feature}:
    put:
      consumes:
      - application/json
      description: 'Sets who can use a feature: disabled, admins or everyone. Grants
        stay and remain additive. Super admin only.'
      parameters:
      - description: Feature key
        in: path
        name: feature
        required: true
        type: string
      - description: Mode
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SetFeatureGateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FeatureGateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set feature gate mode
      tags:
      - Admin - Features
  /admin/features/{feature}/grants:
    post:
      consumes:
      - application/json
      description: Adds a specific-user grant on a feature gate; additive on top of
        the mode. Super admin only.
      parameters:
      - description: Feature key
        in: path
        name: feature
        required: true
        type: string
      - description: User to grant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AddFeatureGrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FeatureGateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Grant a feature to a user
      tags:
      - Admin - Features
  /admin/features/{feature}/grants/{userId}:
    delete:
      description: Removes a specific-user grant from a feature gate. The user keeps
        access the mode gives them. Super admin only.
      parameters:
      - description: Feature key
        in: path
        name: feature
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FeatureGateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a feature grant
      tags:
      - Admin - Features
  /admin/feedback:
    get:
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedFeedback'
      security:
      - BearerAuth: []
      summary: List received feedback
      tags:
      - Admin - Feedback
  /admin/feedback/{id}:
    delete:
      parameters:
      - description: Feedback ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete a feedback entry
      tags:
      - Admin - Feedback
  /admin/graph:
    get:
      description: Returns task nodes (assigned or not), user nodes and assignment
        edges for the admin graph view.
      parameters:
      - description: Workspace key
        in: query
        name: workspace
        type: string
      - description: Comma-separated project keys
        in: query
        name: projects
        type: string
      - description: Comma-separated state types
        in: query
        name: state_types
        type: string
      - description: Comma-separated usernames
        in: query
        name: users
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskGraphResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin task graph
      tags:
      - Admin - Stats
  /admin/graph/filters:
    get:
      description: Returns workspace, project and user options for the admin graph
        view filters.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TaskGraphFiltersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get admin task graph filters
      tags:
      - Admin - Stats
  /admin/import/plane:
    post:
      consumes:
      - multipart/form-data
      description: Upload and import a Plane.so SQL dump file. Max 500MB. Requires
        admin role.
      parameters:
      - description: SQL dump file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
