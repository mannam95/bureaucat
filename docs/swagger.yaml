          $ref: '#/definitions/handlers.MoveProjectToWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Move project to workspace
      tags:
      - Projects
  /projects/{projectKey}/workspace/move-impact:
    get:
      description: Lists project members not in the destination workspace. Admin only.
      parameters:
      - description: Project key
        in: path
        name: projectKey
        required: true
        type: string
      - description: Destination workspace key
        in: query
        name: workspace_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MoveProjectImpactResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview project move impact
      tags:
      - Projects
  /projects/reorder:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Ordered list
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ReorderProjectsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
      security:
      - BearerAuth: []
      summary: Reorder project cards
      tags:
      - Projects
  /search:
    get:
      description: Search across tasks, cycles, and projects the user has access to.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SearchResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Global search
      tags:
      - Search
  /settings/branding:
    get:
      description: Returns the current branding settings. Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BrandingResponse'
      summary: Get branding
      tags:
      - Settings
  /settings/branding/{asset}:
    get:
      description: Serves the uploaded logo or favicon image. Public endpoint.
      parameters:
      - description: logo or favicon
        in: path
        name: asset
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get branding logo or favicon
      tags:
      - Settings
  /settings/feedback:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FeedbackPublicSettings'
      summary: Get public feedback settings
      tags:
      - Settings
  /settings/sso:
    get:
      description: Returns which SSO providers are enabled. Public endpoint, no secrets
        exposed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SSOProvidersPublicResponse'
      summary: Get SSO providers
      tags:
      - Settings
  /signin:
    post:
      consumes:
      - application/json
      description: Authenticate with email/username and password. Returns access token
        and sets refresh token cookie.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SigninRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Sign in
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Register a new user account. The first user created becomes an
        admin.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Sign up
      tags:
      - Auth
  /token_refresh:
    post:
      description: Refresh the access token using the refresh token cookie. Performs
        token rotation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh token
      tags:
      - Auth
  /uploads:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file (images, PDFs, documents). Max 10MB.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload file
      tags:
      - Uploads
  /uploads/{id}:
    get:
      description: Serve a previously uploaded file by its ID. Accepts a Bearer token
        or the access_token cookie.
      parameters:
      - description: Upload ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Serve uploaded file
      tags:
      - Uploads
  /users/{id}:
    get:
      description: Returns a user's public profile by their ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Auth
  /workspaces:
    get:
      description: Returns a paginated list of workspaces. Admins see all; others
        see only their memberships.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PaginatedWorkspacesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List workspaces
      tags:
      - Workspaces
    post:
      consumes:
      - application/json
      description: Create a new workspace. Creator is added as a member. Requires
        admin.
      parameters:
      - description: Workspace details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.WorkspaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create workspace
      tags:
      - Workspaces
  /workspaces/{workspaceKey}:
    delete:
      description: Soft-delete a workspace. Requires admin.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete workspace
      tags:
      - Workspaces
    get:
      description: Returns workspace details by key.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkspaceResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get workspace
      tags:
      - Workspaces
    patch:
      consumes:
      - application/json
      description: Update workspace details. Requires admin.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WorkspaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update workspace
      tags:
      - Workspaces
  /workspaces/{workspaceKey}/members:
    get:
      description: Returns all members of a workspace.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.WorkspaceMemberResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List workspace members
      tags:
      - Workspace Members
    post:
      consumes:
      - application/json
      description: Add a user as a member of the workspace. Requires admin.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      - description: Member details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AddWorkspaceMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.WorkspaceMemberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add workspace member
      tags:
      - Workspace Members
  /workspaces/{workspaceKey}/members/{userId}:
    delete:
      description: Remove a member from the workspace. Requires admin.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove workspace member
      tags:
      - Workspace Members
  /workspaces/{workspaceKey}/members/search:
    get:
      description: Search users by name/username/email. Requires admin.
      parameters:
      - description: Workspace key
        in: path
        name: workspaceKey
        required: true
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search users for workspace membership
      tags:
      - Workspace Members
securityDefinitions:
  BearerAuth:
    description: 'Enter your bearer token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
