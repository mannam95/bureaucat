      due_date:
        type: string
      effort:
        type: integer
      labels:
        items:
          type: string
        type: array
      originators:
        description: |-
          Originators/Requesters (user ids). Optional over the wire — defaults to the
          creator when empty — so there is always at least one.
        items:
          type: string
        type: array
      parent_task_number:
        description: |-
          ParentTaskNumber, when set, creates this task as a subtask of the given
          (project-local) parent task. One level only: the parent must not itself
          be a subtask.
        type: integer
      priority:
        description: |-
          Priority is rejected: priorities are per-project entities now. Clients
          send priority_id instead; a non-nil value here fails the whole request.
        type: integer
      priority_id:
        type: string
      priority_rating:
        type: integer
      pull_request:
        type: string
      start_date:
        type: string
      state_id:
        type: string
      title:
        type: string
      watchers:
        description: Watchers (user ids) who will follow the task. Optional; zero
          or more.
        items:
          type: string
        type: array
    type: object
